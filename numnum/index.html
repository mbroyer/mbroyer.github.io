<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b2420">
<title>NumNum</title>
<style>
:root{color-scheme:dark;--bg:#0b2420;--surface:#133630;--ink:#effaf4;--muted:#9cc6b8;--line:#25514a;--accent:#ff4f9a;--accent-edge:#b81a66;--accent-ink:#2b0a18;--bad:#ff8a66}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;text-align:center}
h1{margin:0;font-size:2rem}
p{margin:0;color:var(--muted)}
input{width:100%;font:inherit;font-size:1.3rem;font-weight:700;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;color:#1b2340;text-align:center}
input:focus{border-color:var(--accent);outline:none}
button{font:inherit;font-weight:700;font-size:1.2rem;padding:14px 22px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 var(--accent-edge);cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
[hidden]{display:none!important}
</style>
</head>
<body>
<form class="card" id="f" hidden>
  <h1>NumNum</h1>
  <p>Gib den Code ein, den du von Mark bekommen hast. Danach merkt sich dieses Gerät den Code.</p>
  <input id="c" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Code">
  <button id="b">Los</button>
  <div class="err" id="e" role="alert"></div>
</form>
<div class="card" id="w"><h1>NumNum</h1><p id="wt">Lädt …</p></div>
<script>
(function(){
  // Anmeldung mit Code wie bei Readster: der Cloudflare-Worker prüft den Code und hält den Spielstand pro Code.
  var WORKER="https://numnum.mark-broyer.workers.dev",APP="app.html",STORE='numnum-code',SAVE='zahli-mathe-v1',TAKEN='numnum-alt-uebernommen';
  var f=document.getElementById('f'),c=document.getElementById('c'),b=document.getElementById('b'),e=document.getElementById('e'),w=document.getElementById('w');
  function norm(x){return String(x||'').toUpperCase().replace(/[^A-Z0-9-]/g,'');}
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(_){return null;}}
  function ask(msg){w.hidden=true;f.hidden=false;e.textContent=msg||'';b.disabled=false;c.focus();}
  function fail(err){var m={code:'Der Code stimmt nicht.',net:'Keine Verbindung. Bitte später nochmal versuchen.'};ask(m[err&&err.message]||'Das hat nicht geklappt. Bitte nochmal versuchen.');}
  function remote(code){
    return fetch(WORKER+'/stand/'+encodeURIComponent(code),{cache:'no-store'}).then(function(r){
      if(r.status===403)throw new Error('code');
      if(r.status===404)return null;
      if(!r.ok)throw new Error('net');
      return r.json();
    },function(){throw new Error('net');});
  }
  function launch(code,rem){
    var LK=SAVE+'@'+code,TK='numnum-ts@'+code,lts=+ls(TK)||0,rts=rem&&+rem.ts||0;
    if(rem&&rem.state&&rts>lts){ls(LK,JSON.stringify(rem.state));ls(TK,String(rts));lts=rts;}
    else if(!rem&&!ls(LK)&&ls(SAVE)&&!ls(TAKEN)){ls(LK,ls(SAVE));ls(TAKEN,code);lts=Date.now();ls(TK,String(lts));} // bisherigen Stand dieses Geräts einmal übernehmen
    ls(STORE,code);
    return fetch(APP).then(function(r){if(!r.ok)throw new Error('net');return r.text();},function(){throw new Error('net');}).then(function(html){
      var cfg=JSON.stringify({w:WORKER,c:code,k:SAVE,lk:LK,tk:TK,push:lts>rts&&!!ls(LK)});
      var shim='<script>(function(C){var S=Storage.prototype,g=S.getItem,st=S.setItem,rm=S.removeItem,t=null;'+
        'function map(s,k){return s===window.localStorage&&k===C.k?C.lk:k;}'+
        'function push(){t=null;var v=g.call(localStorage,C.lk);if(!v)return;try{fetch(C.w+"/stand/"+encodeURIComponent(C.c),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:JSON.parse(v),ts:+g.call(localStorage,C.tk)||Date.now()}),keepalive:true}).catch(function(){});}catch(_){}}'+
        'function later(){if(!t)t=setTimeout(push,4000);}'+
        'S.getItem=function(k){return g.call(this,map(this,k));};'+
        'S.removeItem=function(k){return rm.call(this,map(this,k));};'+
        'S.setItem=function(k,v){var m=map(this,k);st.call(this,m,v);if(m===C.lk){st.call(this,C.tk,String(Date.now()));later();}};'+
        'addEventListener("pagehide",function(){if(t){clearTimeout(t);push();}});'+
        'document.addEventListener("visibilitychange",function(){if(document.hidden&&t){clearTimeout(t);push();}});'+
        'if(C.push)push();})('+cfg+');<\/script>';
      html=html.replace('<head>','<head>\n'+shim);
      document.open();document.write(html);document.close();
    });
  }
  function start(code,saved){
    return remote(code).then(function(rem){return launch(code,rem);},function(err){
      if(saved&&err.message==='net'&&ls(SAVE+'@'+code))return launch(code,null); // offline weiterspielen, Abgleich beim nächsten Speichern
      if(saved&&err.message==='code'){ls(STORE,null);throw new Error('code');}
      throw err;
    });
  }
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    var code=norm(c.value);
    if(code.length<4){ask('Bitte den Code eingeben.');return;}
    b.disabled=true;e.textContent='';
    start(code,false).catch(fail);
  });
  var q=new URLSearchParams(location.search),fromUrl=norm(q.get('code'));
  if(q.has('wechseln'))ls(STORE,null);
  if(q.has('wechseln')||fromUrl)history.replaceState(null,'',location.pathname);
  var saved=fromUrl||norm(ls(STORE));
  if(saved)start(saved,!fromUrl).catch(function(err){c.value=saved;fail(err);});
  else ask();
})();
</script>
</body>
</html>
