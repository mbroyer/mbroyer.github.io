<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b2420">
<title>NumNum</title>
<style>
:root{color-scheme:dark;--bg:#0b2420;--surface:#133630;--ink:#effaf4;--muted:#9cc6b8;--line:#25514a;--accent:#ff4f9a;--accent-edge:#b81a66;--accent-ink:#2b0a18;--bad:#ff8a66}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:380px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;text-align:center}
h1{margin:0;font-size:2rem}
p{margin:0;color:var(--muted)}
input{width:100%;font:inherit;font-size:1.3rem;font-weight:700;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:#fff;color:#1b2340;text-align:center}
input:focus{border-color:var(--accent);outline:none}
button{font:inherit;font-weight:700;font-size:1.2rem;padding:14px 22px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 5px 0 var(--accent-edge);cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.err{color:var(--bad);font-weight:700;min-height:1.4em}
[hidden]{display:none!important}
</style>
</head>
<body>
<form class="card" id="f" hidden>
  <h1>NumNum</h1>
  <p>Gib den Code ein, den du von Mark bekommen hast. Danach merkt sich dieses Gerät den Code.</p>
  <input id="c" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Code">
  <button id="b">Los</button>
  <div class="err" id="e" role="alert"></div>
</form>
<div class="card" id="w"><h1>NumNum</h1><p id="wt">Lädt …</p></div>
<script>
(function(){
  var DATA="numnum-986fb85aaf.bin",KEYS="numnum-b40f7e0bbe.keys",ITER=300000,STORE='numnum-code',SAVE='zahli-mathe-v1';
  var f=document.getElementById('f'),c=document.getElementById('c'),b=document.getElementById('b'),e=document.getElementById('e'),w=document.getElementById('w');
  var s=window.crypto&&crypto.subtle,files={};
  function get(n){
    if(files[n])return Promise.resolve(files[n]);
    return fetch(n).then(function(r){if(!r.ok)throw new Error('net');return r.arrayBuffer();}).then(function(x){return files[n]=new Uint8Array(x);});
  }
  // Jeder Code entschlüsselt denselben Datenschlüssel plus seinen Spielstand-Namen
  function openKey(code){
    return get(KEYS).then(function(d){
      return s.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey'])
        .then(function(k){return s.deriveKey({name:'PBKDF2',salt:d.slice(0,16),iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);})
        .then(function(kek){
          var i=16,tries=[];
          while(i<d.length){var n=d[i]<<8|d[i+1];tries.push([d.slice(i+2,i+14),d.slice(i+14,i+14+n)]);i+=14+n;}
          function next(j){
            if(j>=tries.length)return Promise.reject(new Error('code'));
            return s.decrypt({name:'AES-GCM',iv:tries[j][0]},kek,tries[j][1]).then(function(x){return JSON.parse(new TextDecoder().decode(x));},function(){return next(j+1);});
          }
          return next(0);
        });
    });
  }
  function unlock(code){
    code=code.trim().toLowerCase();
    var prof;
    return openKey(code).then(function(o){
      prof=o.p;
      return Promise.all([get(DATA),s.importKey('raw',Uint8Array.from(atob(o.k),function(ch){return ch.charCodeAt(0);}),'AES-GCM',false,['decrypt'])]);
    }).then(function(r){return s.decrypt({name:'AES-GCM',iv:r[0].slice(0,12)},r[1],r[0].slice(12));}).then(function(pt){
      try{localStorage.setItem(STORE,code);}catch(_){}
      var html=new TextDecoder().decode(pt);
      // Eigener Spielstand je Code: zahli-mathe-v1@<name>, der erste Code behält zahli-mathe-v1
      if(prof)html=html.replace('<head>','<head>\n<script>(function(){var K='+JSON.stringify(SAVE)+',P='+JSON.stringify(K_(prof))+',S=Storage.prototype;["getItem","setItem","removeItem"].forEach(function(m){var o=S[m];S[m]=function(k){var a=[].slice.call(arguments);if(this===window.localStorage&&k===K)a[0]=P;return o.apply(this,a);};});})();<\/script>');
      document.open();document.write(html);document.close();
    });
  }
  function K_(p){return SAVE+'@'+p;}
  if(/[?&]wechseln\b/.test(location.search)){try{localStorage.removeItem(STORE);}catch(_){}history.replaceState(null,'',location.pathname);}
  function ask(msg){w.hidden=true;f.hidden=false;e.textContent=msg||'';b.disabled=false;c.focus();}
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    if(!c.value.trim()){ask('Bitte den Code eingeben.');return;}
    b.disabled=true;e.textContent='';
    unlock(c.value).catch(function(err){ask(err&&err.message==='net'?'Keine Verbindung. Bitte später nochmal versuchen.':'Der Code stimmt nicht.');});
  });
  if(!window.crypto||!crypto.subtle){document.getElementById('wt').textContent='Dieser Browser ist zu alt für NumNum.';return;}
  var saved=null;try{saved=localStorage.getItem(STORE);}catch(_){}
  if(saved)unlock(saved).catch(function(err){ask(err&&err.message==='net'?'Keine Verbindung. Bitte später nochmal versuchen.':'');});
  else ask();
})();
</script>
</body>
</html>
