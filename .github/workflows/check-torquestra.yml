# Lehnt jeden PR ab, der den lesbaren Build von torquestra statt des Release-Builds auf die Website bringt.
name: torquestra release build
on:
  pull_request:
    paths: ['torquestra/spiel/index.html', 'tools/check-torquestra.sh', 'tools/check-release.sh']
  push:
    branches: [main]
    paths: ['torquestra/spiel/index.html', 'tools/check-torquestra.sh', 'tools/check-release.sh']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/check-torquestra.sh
