# Lehnt jeden PR ab, der den lesbaren Build von numnum statt des Release-Builds auf die Website bringt.
name: numnum release build
on:
  pull_request:
    paths: ['numnum/app.html', 'tools/check-numnum.sh', 'tools/check-release.sh']
  push:
    branches: [main]
    paths: ['numnum/app.html', 'tools/check-numnum.sh', 'tools/check-release.sh']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/check-numnum.sh
