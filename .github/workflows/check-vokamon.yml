# Lehnt jeden PR ab, der den lesbaren Build von vokamon statt des Release-Builds auf die Website bringt.
name: vokamon release build
on:
  pull_request:
    paths: ['vokamon/*.html', 'tools/check-vokamon.sh', 'tools/check-release.sh']
  push:
    branches: [main]
    paths: ['vokamon/*.html', 'tools/check-vokamon.sh', 'tools/check-release.sh']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/check-vokamon.sh
