# Lehnt jeden PR ab, der den lesbaren Build von orbista statt des Release-Builds auf die Website bringt.
name: orbista release build
on:
  pull_request:
    paths: ['orbista/app.html', 'tools/check-orbista.sh', 'tools/check-release.sh']
  push:
    branches: [main]
    paths: ['orbista/app.html', 'tools/check-orbista.sh', 'tools/check-release.sh']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/check-orbista.sh
