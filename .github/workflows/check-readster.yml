# Lehnt jeden PR ab, der den lesbaren Build von readster statt des Release-Builds auf die Website bringt.
name: readster release build
on:
  pull_request:
    paths: ['readster/**', 'tools/check-readster.sh', 'tools/check-release.sh']
  push:
    branches: [main]
    paths: ['readster/**', 'tools/check-readster.sh', 'tools/check-release.sh']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tools/check-readster.sh
